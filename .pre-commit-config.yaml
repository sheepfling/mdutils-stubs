repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: typing-fixtures
        name: Mypy and Pyright external-consumer fixtures
        entry: python -m tests.check_typing_fixtures
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Repository tests
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: runtime-api
        name: Runtime API checks
        entry: python -m tests.runtime_api
        language: system
        pass_filenames: false
        always_run: true
      - id: stubtest
        name: Mypy runtime/stub compatibility
        entry: python -m mypy.stubtest --allowlist stubtest-allowlist.txt mdutils
        language: system
        pass_filenames: false
        always_run: true
