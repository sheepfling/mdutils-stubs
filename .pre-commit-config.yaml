repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: typing-fixtures
        name: Mypy and Pyright external-consumer fixtures
        entry: scripts/check-typing-fixtures.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: api-coverage
        name: Runtime and stub API coverage inventory
        entry: python tests/test_api_coverage.py --stub-root mdutils-stubs
        language: system
        pass_filenames: false
        always_run: true
      - id: runtime-api
        name: Runtime API checks
        entry: python tests/runtime_api.py
        language: system
        pass_filenames: false
        always_run: true
      - id: stubtest
        name: Mypy runtime/stub compatibility
        entry: stubtest --allowlist stubtest-allowlist.txt mdutils
        language: system
        pass_filenames: false
        always_run: true
