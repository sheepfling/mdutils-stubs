name: Verify merged candidate

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: sheepfling/alphus/ci/stub-quality@bb4a1e8ef2a6442a844c16fffc546f8ae8f52a05
        with:
          requirements-file: requirements/compatibility.txt
          config-file: stub-quality.json
          with-twine: "true"
      - run: python -m pip install "ruff>=0.16" "pytest>=7.4"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
