name: Verify merged candidate

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: sheepfling/alphus/ci/quality@d613d28dad418ed02a0fd2a94ee6e75df09abe9e
        with:
          requirements-file: requirements-verification.txt
          runtime-requirements-file: requirements/compatibility.txt
          config-file: quality-gates.toml
          profile: check
