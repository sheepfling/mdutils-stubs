name: Verify merged candidate

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]" -r requirements/compatibility.txt
      - run: python -m build
      - run: python -m pip install --no-deps --force-reinstall dist/mdutils_stubs-*.whl
      - run: ruff check .
      - run: ruff format --check .
      - run: python tests/test_api_coverage.py
      - run: scripts/check-typing-fixtures.sh
      - run: python tests/runtime_api.py
      - run: stubtest --allowlist stubtest-allowlist.txt mdutils
      - run: twine check dist/*
